apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
data:
  fluent.conf: |
    <source>
      @type tail

      path /var/log/containers/*_app_*.log
      pos_file /fluentd/log/fluentd-app.pos

      tag app.nginx
      read_from_head true

      <parse>
        @type regexp
        expression ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]+) (?<message>.*)$
        time_key time
        time_type string
      </parse>
    </source>

    <match app.nginx>
      @type file
      path /fluentd/log/app

      <buffer>
        flush_mode interval
        flush_interval 5s
      </buffer>
    </match>
