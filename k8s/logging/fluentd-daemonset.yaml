apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      initContainers:
        - name: prepare-output-directory
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /fluentd/log
              chmod 777 /fluentd/log
          volumeMounts:
            - name: fluentd-output
              mountPath: /fluentd/log

      containers:
        - name: fluentd
          image: fluent/fluentd:v1.18-debian-1
          volumeMounts:
            - name: varlog
              mountPath: /var/log

            - name: fluentd-config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf

            - name: fluentd-output
              mountPath: /fluentd/log

      volumes:
        - name: varlog
          hostPath:
            path: /var/log

        - name: fluentd-config
          configMap:
            name: fluentd-config

        - name: fluentd-output
          hostPath:
            path: /var/log/fluentd
            type: DirectoryOrCreate
